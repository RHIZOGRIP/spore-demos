[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="balance.json"
exclude_filter=".godot/*,out/*,outputs/*,build/*,builds/*,web/*,video/*,captures/*,runtime/*,attempt*.*,test.gd,export_schedules.gd,replay_oracle.gd,measure_ui.gd,targets.json,oracle-plans.json,planner/*,test-output/*,tests/*,playtest*.json,*.avi,*.mp4,*.wav,*.png,shell.html"
export_path="../out/web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell="res://shell.html"
html/head_include="<meta name=\"theme-color\" content=\"#091c2b\"><meta name=\"description\" content=\"Kêr-Is — hold the drowned city of Ys through twelve tides. A procedural Breton legend.\"><style>html,body{background:#091c2b;overscroll-behavior:none;touch-action:none;}#canvas{touch-action:none;}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
